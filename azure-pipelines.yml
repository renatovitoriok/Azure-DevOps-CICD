# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'SampleApp/SampleApp.csproj'
  artifactName: 'publish'

steps:
- task: UseDotNet@2
  displayName: 'Instalar .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet restore $(projectPath)
  displayName: 'Restaurar dependências'

- script: dotnet build $(projectPath) --configuration $(buildConfiguration) --no-restore
  displayName: 'Compilar aplicação'

- script: dotnet test SampleApp.Tests/SampleApp.Tests.csproj --configuration $(buildConfiguration) --no-build
  displayName: 'Executar testes automatizados'

- script: dotnet publish $(projectPath) --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build
  displayName: 'Publicar aplicação'

- task: PublishPipelineArtifact@1
  displayName: 'Publicar artefato'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: '$(artifactName)'
