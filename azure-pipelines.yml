# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

parameters:
- name: rollbackBuildId
  displayName: 'BuildId para rollback (use NONE para execução normal)'
  type: string
  default: 'NONE'

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: cicd-variables

- name: buildConfiguration
  value: 'Release'

- name: projectPath
  value: 'SampleApp/SampleApp.csproj'

- name: artifactName
  value: 'publish'

- name: major
  value: '1'

- name: minor
  value: '0'

stages:
# =========================
# CI
# =========================
- stage: CI
  displayName: 'CI - Build e Testes'
  condition: eq('${{ parameters.rollbackBuildId }}', 'NONE')
  jobs:
  - job: Build
    displayName: 'Build da aplicação'
    steps:
    - script: |
        echo "##vso[task.setvariable variable=appVersion]$(major).$(minor).$(Build.BuildId)"
      displayName: 'Gerar versão da aplicação'

    - script: |
        echo "Versão da aplicação: $(appVersion)"
        echo "BuildId: $(Build.BuildId)"
      displayName: 'Exibir versão da aplicação'
    
    - task: UseDotNet@2
      displayName: 'Instalar .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: Cache@2
      displayName: 'Cache de pacotes NuGet'
      inputs:
        key: 'nuget | "$(Agent.OS)" | **/*.csproj'
        restoreKeys: |
          nuget | "$(Agent.OS)"
          nuget
        path: '$(HOME)/.nuget/packages'

    - script: dotnet restore $(projectPath)
      displayName: 'Restaurar dependências'

    - script: |
        if [ -z "$APP_API_KEY" ]; then
          echo "Secret APP_API_KEY não foi carregado."
          exit 1
        fi

        echo "Secret APP_API_KEY carregado com sucesso."
      displayName: 'Validar secret da pipeline'
      env:
        APP_API_KEY: $(APP_API_KEY)

    - script: |
        dotnet build $(projectPath) \
          --configuration $(buildConfiguration) \
          --no-restore \
          /warnaserror
      displayName: 'Compilar aplicação com análise de qualidade'

    - script: |
        dotnet test SampleApp.Tests/SampleApp.Tests.csproj \
          --configuration $(buildConfiguration) \
          --collect:"XPlat Code Coverage" \
          --results-directory "$(Agent.TempDirectory)/TestResults"
      displayName: 'Executar testes com cobertura'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publicar cobertura de testes'
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

    - script: dotnet publish $(projectPath) --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build
      displayName: 'Publicar aplicação'

    - script: |
        cp "$(Build.SourcesDirectory)/SampleApp/Dockerfile" "$(Build.ArtifactStagingDirectory)/Dockerfile"

        docker build \
          -t sampleapp:$(Build.BuildId) \
          -t sampleapp:$(appVersion) \
          "$(Build.ArtifactStagingDirectory)"
      displayName: 'Criar imagem Docker'

    - script: |
        docker save \
          -o "$(Build.ArtifactStagingDirectory)/sampleapp-$(Build.BuildId).tar" \
          sampleapp:$(Build.BuildId)
      displayName: 'Salvar imagem Docker'

    - task: PublishPipelineArtifact@1
      displayName: 'Publicar imagem Docker'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/sampleapp-$(Build.BuildId).tar'
        artifact: 'docker-image'

    - task: PublishPipelineArtifact@1
      displayName: 'Publicar artefato'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: '$(artifactName)'

# =========================
# TERRAFORM
# =========================
- stage: TERRAFORM
  displayName: 'Terraform - Validar e Planejar'
  dependsOn: CI
  condition: and(succeeded(), eq('${{ parameters.rollbackBuildId }}', 'NONE'))

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Init, Validate e Plan'

    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Terraform Init, Validate e Plan'
      inputs:
        azureSubscription: 'azure-terraform-sc'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |
          terraform init
          terraform validate
          terraform plan

# =========================
# HML
# =========================
- stage: HML
  displayName: 'Deploy HML'
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.rollbackBuildId }}', 'NONE'))

  jobs:
  - deployment: DeployHML
    displayName: 'Deploy da aplicação em HML'
    environment: HML

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/deploy-docker.yml
            parameters:
              containerName: 'sampleapp-hml'
              environmentName: 'HML'

# =========================
# PRD
# =========================
- stage: PRD
  displayName: 'Deploy PRD'
  dependsOn: HML
  condition: and(succeeded(), eq('${{ parameters.rollbackBuildId }}', 'NONE'))

  jobs:
  - deployment: DeployPRD
    displayName: 'Deploy da aplicação em PRD'
    environment: PRD

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/deploy-docker.yml
            parameters:
              containerName: 'sampleapp-prd'
              environmentName: 'PRD'

# =========================
# ROLLBACK
# =========================
- stage: ROLLBACK
  displayName: 'Rollback'
  dependsOn: []
  condition: ne('${{ parameters.rollbackBuildId }}', 'NONE')

  jobs:
  - job: Rollback
    displayName: 'Executar Rollback'

    steps:
    - script: |
        echo "Rollback solicitado."
        echo "BuildId selecionado: ${{ parameters.rollbackBuildId }}"
      displayName: 'Identificar versão para rollback'

    - template: templates/rollback-docker.yml
      parameters:
        containerName: 'sampleapp-rollback'
        environmentName: 'HML'
        rollbackBuildId: '${{ parameters.rollbackBuildId }}'

# =========================
# ROLLBACK PRD
# =========================
- stage: ROLLBACK_PRD
  displayName: 'Rollback PRD'
  dependsOn: ROLLBACK
  condition: and(succeeded(), ne('${{ parameters.rollbackBuildId }}', 'NONE'))

  jobs:
  - deployment: RollbackPRD
    displayName: 'Aplicar rollback em PRD'
    environment: PRD

    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/rollback-docker.yml
            parameters:
              containerName: 'sampleapp-rollback-prd'
              environmentName: 'PRD'
              rollbackBuildId: '${{ parameters.rollbackBuildId }}'
