# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

parameters:
- name: rollbackBuildId
  displayName: 'BuildId para rollback'
  type: string
  default: ''

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'SampleApp/SampleApp.csproj'
  artifactName: 'publish'

stages:
# =========================
# CI
# =========================
- stage: CI
  displayName: 'CI - Build e Testes'
  condition: eq('${{ parameters.rollbackBuildId }}', '')
  jobs:
  - job: Build
    displayName: 'Build da aplicação'
    steps:
    - task: UseDotNet@2
      displayName: 'Instalar .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: dotnet restore $(projectPath)
      displayName: 'Restaurar dependências'

    - script: dotnet build $(projectPath) --configuration $(buildConfiguration) --no-restore
      displayName: 'Compilar aplicação'

    - script: dotnet test SampleApp.Tests/SampleApp.Tests.csproj --configuration $(buildConfiguration)
      displayName: 'Executar testes automatizados'

    - script: dotnet publish $(projectPath) --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build
      displayName: 'Publicar aplicação'

    - script: |
        cp "$(Build.SourcesDirectory)/SampleApp/Dockerfile" "$(Build.ArtifactStagingDirectory)/Dockerfile"

        docker build \
          -t sampleapp:$(Build.BuildId) \
          "$(Build.ArtifactStagingDirectory)"
      displayName: 'Criar imagem Docker'

    - script: |
        docker save \
          -o "$(Build.ArtifactStagingDirectory)/sampleapp-$(Build.BuildId).tar" \
          sampleapp:$(Build.BuildId)
      displayName: 'Salvar imagem Docker'

    - task: PublishPipelineArtifact@1
      displayName: 'Publicar imagem Docker'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/sampleapp-$(Build.BuildId).tar'
        artifact: 'docker-image'

    - task: PublishPipelineArtifact@1
      displayName: 'Publicar artefato'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: '$(artifactName)'

# =========================
# HML
# =========================
- stage: HML
  displayName: 'Deploy HML'
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.rollbackBuildId }}', ''))
  jobs:
  - deployment: DeployHML
    displayName: 'Deploy da aplicação em HML'
    environment: HML
    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: 'docker-image'

          - script: |
              docker load -i "$(Pipeline.Workspace)/docker-image/sampleapp-$(Build.BuildId).tar"
            displayName: 'Carregar imagem Docker'

          - script: |
              docker run -d \
                --name sampleapp-hml \
                -p 8080:8080 \
                sampleapp:$(Build.BuildId)
            displayName: 'Iniciar container HML'

          - script: |
              for i in {1..10}
              do
                if curl --fail http://localhost:8080/health
                then
                  echo "Health check realizado com sucesso."
                  exit 0
                fi

                echo "Aplicação ainda não disponível. Tentativa $i de 10..."
                sleep 3
              done

              echo "Health check falhou."
              docker logs sampleapp-hml
              exit 1
            displayName: 'Validar Health Check'

          - script: |
              docker rm -f sampleapp-hml || true
            displayName: 'Finalizar container HML'
            condition: always()

# =========================
# PRD
# =========================
- stage: PRD
  displayName: 'Deploy PRD'
  dependsOn: HML
  condition: and(succeeded(), eq('${{ parameters.rollbackBuildId }}', ''))
  jobs:
  - deployment: DeployPRD
    displayName: 'Deploy da aplicação em PRD'
    environment: PRD
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: 'docker-image'

          - script: |
              docker load -i "$(Pipeline.Workspace)/docker-image/sampleapp-$(Build.BuildId).tar"
            displayName: 'Carregar imagem Docker PRD'

          - script: |
              docker run -d \
                --name sampleapp-prd \
                -p 8080:8080 \
                sampleapp:$(Build.BuildId)
            displayName: 'Iniciar container PRD'

          - script: |
              for i in {1..10}
              do
                if curl --fail http://localhost:8080/health
                then
                  echo "Health check PRD realizado com sucesso."
                  exit 0
                fi

                echo "Aplicação PRD ainda não disponível. Tentativa $i de 10..."
                sleep 3
              done

              echo "Health check PRD falhou."
              docker logs sampleapp-prd
              exit 1
            displayName: 'Validar Health Check PRD'

          - script: |
              docker rm -f sampleapp-prd || true
            displayName: 'Finalizar container PRD'
            condition: always()

# =========================
# ROLLBACK
# =========================
- stage: ROLLBACK
  displayName: 'Rollback'
  dependsOn: []
  condition: ne('${{ parameters.rollbackBuildId }}', '')
  jobs:
  - job: Rollback
    displayName: 'Executar Rollback'
    steps:
    - script: |
        echo "Rollback solicitado."
        echo "BuildId selecionado: ${{ parameters.rollbackBuildId }}"
      displayName: 'Identificar versão para rollback'
    - task: DownloadPipelineArtifact@2
      displayName: 'Baixar imagem da versão anterior'
      inputs:
        buildType: 'specific'
        project: '$(System.TeamProject)'
        definition: '$(System.DefinitionId)'
        buildVersionToDownload: 'specific'
        pipelineId: '${{ parameters.rollbackBuildId }}'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/rollback-image'

    - script: |
        docker load -i "$(Pipeline.Workspace)/rollback-image/sampleapp-${{ parameters.rollbackBuildId }}.tar"
      displayName: 'Carregar imagem de rollback'

    - script: |
        docker run -d \
          --name sampleapp-rollback \
          -p 8080:8080 \
          sampleapp:${{ parameters.rollbackBuildId }}
      displayName: 'Iniciar container de rollback'

    - script: |
        for i in {1..10}
        do
          if curl --fail http://localhost:8080/health
          then
            echo "Health check do rollback realizado com sucesso."
            exit 0
          fi
    
          echo "Aplicação de rollback ainda não disponível. Tentativa $i de 10..."
          sleep 3
        done
    
        echo "Health check do rollback falhou."
        docker logs sampleapp-rollback
        exit 1
      displayName: 'Validar Health Check do rollback'

    - script: |
        docker rm -f sampleapp-rollback || true
      displayName: 'Finalizar container de rollback'
      condition: always()

# =========================
# ROLLBACK PRD
# =========================
- stage: ROLLBACK_PRD
  displayName: 'Rollback PRD'
  dependsOn: ROLLBACK
  condition: and(succeeded(), ne('${{ parameters.rollbackBuildId }}', ''))

  jobs:
  - deployment: RollbackPRD
    displayName: 'Aplicar rollback em PRD'
    environment: 'PRD'

    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadPipelineArtifact@2
            displayName: 'Baixar imagem para rollback em PRD'
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: '$(System.DefinitionId)'
              buildVersionToDownload: 'specific'
              pipelineId: '${{ parameters.rollbackBuildId }}'
              artifactName: 'docker-image'
              targetPath: '$(Pipeline.Workspace)/rollback-prd'

          - script: |
              docker load -i "$(Pipeline.Workspace)/rollback-prd/sampleapp-${{ parameters.rollbackBuildId }}.tar"
            displayName: 'Carregar imagem de rollback em PRD'

          - script: |
              docker run -d \
                --name sampleapp-rollback-prd \
                -p 8080:8080 \
                sampleapp:${{ parameters.rollbackBuildId }}
            displayName: 'Iniciar versão de rollback em PRD'

          - script: |
              for i in {1..10}
              do
                if curl --fail http://localhost:8080/health
                then
                  echo "Health check do rollback em PRD realizado com sucesso."
                  exit 0
                fi

                echo "Rollback em PRD ainda não disponível. Tentativa $i de 10..."
                sleep 3
              done

              echo "Health check do rollback em PRD falhou."
              docker logs sampleapp-rollback-prd
              exit 1
            displayName: 'Validar Health Check do rollback em PRD'

          - script: |
              docker rm -f sampleapp-rollback-prd || true
            displayName: 'Finalizar container de rollback em PRD'
            condition: always()
