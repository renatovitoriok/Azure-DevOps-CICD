# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'SampleApp/SampleApp.csproj'
  artifactName: 'publish'

stages:

# =========================
# CI
# =========================
- stage: CI
  displayName: 'CI - Build e Testes'

  jobs:
  - job: Build
    displayName: 'Build da aplicação'

    steps:
    - task: UseDotNet@2
      displayName: 'Instalar .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: dotnet restore $(projectPath)
      displayName: 'Restaurar dependências'

    - script: dotnet build $(projectPath) --configuration $(buildConfiguration) --no-restore
      displayName: 'Compilar aplicação'

    - script: dotnet test SampleApp.Tests/SampleApp.Tests.csproj --configuration $(buildConfiguration)
      displayName: 'Executar testes automatizados'

    - script: dotnet publish $(projectPath) --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-build
      displayName: 'Publicar aplicação'

    - task: PublishPipelineArtifact@1
      displayName: 'Publicar artefato'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: '$(artifactName)'


# =========================
# HML
# =========================
- stage: HML
  displayName: 'Deploy HML'
  dependsOn: CI
  condition: succeeded()

  jobs:
  - deployment: DeployHML
    displayName: 'Deploy da aplicação em HML'
    environment: 'HML'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: current
            artifact: '$(artifactName)'

          - script: |
              cp "$(Build.SourcesDirectory)/SampleApp/Dockerfile" "$(Pipeline.Workspace)/$(artifactName)/Dockerfile"
            displayName: 'Preparar Dockerfile'

          - script: |
              docker build -t sampleapp:hml "$(Pipeline.Workspace)/$(artifactName)"
            displayName: 'Criar imagem Docker'

          - script: |
              docker run -d \
                --name sampleapp-hml \
                -p 8080:8080 \
                sampleapp:hml
            displayName: 'Iniciar container HML'

          - script: |
              for i in {1..10}
              do
                if curl --fail http://localhost:8080/health
                then
                  echo "Health check realizado com sucesso."
                  exit 0
                fi

                echo "Aplicação ainda não disponível. Tentativa $i de 10..."
                sleep 3
              done

              echo "Health check falhou."
              docker logs sampleapp-hml
              exit 1
            displayName: 'Validar Health Check'

          - script: |
              docker rm -f sampleapp-hml || true
            displayName: 'Finalizar container HML'
            condition: always()


# =========================
# PRD
# =========================
- stage: PRD
  displayName: 'Deploy PRD'
  dependsOn: HML
  condition: succeeded()

  jobs:
  - deployment: DeployPRD
    displayName: 'Deploy da aplicação em PRD'
    environment: 'PRD'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - download: current
            artifact: '$(artifactName)'

          - script: |
              cp "$(Build.SourcesDirectory)/SampleApp/Dockerfile" "$(Pipeline.Workspace)/$(artifactName)/Dockerfile"
            displayName: 'Preparar Dockerfile'

          - script: |
              docker build -t sampleapp:prd "$(Pipeline.Workspace)/$(artifactName)"
            displayName: 'Criar imagem Docker PRD'

          - script: |
              docker run -d \
                --name sampleapp-prd \
                -p 8080:8080 \
                sampleapp:prd
            displayName: 'Iniciar container PRD'

          - script: |
              for i in {1..10}
              do
                if curl --fail http://localhost:8080/health
                then
                  echo "Health check PRD realizado com sucesso."
                  exit 0
                fi

                echo "Aplicação PRD ainda não disponível. Tentativa $i de 10..."
                sleep 3
              done

              echo "Health check PRD falhou."
              docker logs sampleapp-prd
              exit 1
            displayName: 'Validar Health Check PRD'

          - script: |
              docker rm -f sampleapp-prd || true
            displayName: 'Finalizar container PRD'
            condition: always()
